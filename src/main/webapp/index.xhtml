<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    #{dao.all()}
    <h:outputLabel value="Hello, world"/>
    <h:dataTable value="#{controller.data}" var="each">
        <h:column>
            <f:facet name="header">Product ID</f:facet>
            <h1>#{each.id}</h1>
        </h:column>
        <h:column>
            <f:facet name="header">Product Name</f:facet>
            <h1>#{each.name}</h1>
        </h:column>
        <h:column>
            <f:facet name="header">Product Price</f:facet>
            <h1>#{each.getPrice()}</h1>
        </h:column>
        <h:column>
            <h:commandButton type="button" value="select" action="#{controller.setHai(each)}" >
<!--                <f:param name="hai" value="#{each}"/>-->
            </h:commandButton>
        </h:column>
    </h:dataTable>
    

        <h:inputText value="#{controller.hai.id}" />
        <h:inputText value="#{controller.hai.name}" />
        <h:inputText value="#{controller.hai.price}" />

</f:view>
</html>
